name: uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check healthz
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://eunwol.duckdns.org/healthz)
          echo "HTTP $code"
          test "$code" = "200"
